<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <style>
    :root {
      --bg: #fafafa; --card: #fff; --text: #18181b; --muted: #71717a;
      --border: #e4e4e7; --accent: #4f46e5; --accent-text: #fff; --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #09090b; --card: #18181b; --text: #fafafa; --muted: #a1a1aa; --border: #27272a; --accent: #6366f1; --danger: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text); font: inherit; cursor: pointer; }
    button.link { background: none; color: var(--muted); padding: 4px 8px; }
    button.link:hover { color: var(--danger); }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); }
    li:first-child { border-top: 0; }
    li label { flex: 1; cursor: pointer; word-break: break-word; }
    li.done label { color: var(--muted); text-decoration: line-through; }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .error { color: var(--danger); font-size: 13px; min-height: 20px; }
  </style>
</head>
<body>
<main>
  <h1>Todos</h1>
  <p class="sub" id="info">Stored in SQLite under <code>data/</code>, kept across deploys.</p>
  <form id="add">
    <input type="text" id="title" placeholder="What needs doing?" maxlength="200" autocomplete="off" autofocus>
    <button type="submit">Add</button>
  </form>
  <div class="error" id="error"></div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button class="link" id="clear" type="button">Clear completed</button>
  </footer>
</main>
<script>
  const list = document.getElementById('list');
  const errorEl = document.getElementById('error');

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    return res.status === 204 ? null : res.json();
  }

  async function run(fn) {
    errorEl.textContent = '';
    try { await fn(); await load(); } catch (e) { errorEl.textContent = String(e.message || e); }
  }

  function render(todos) {
    list.replaceChildren();
    if (todos.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Nothing to do. Add something above.';
      list.append(li);
    }
    for (const t of todos) {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.id = 'todo-' + t.id;
      box.checked = t.done;
      box.onchange = () => run(() => api('PATCH', `/api/todos/${t.id}`, { done: box.checked }));
      const label = document.createElement('label');
      label.htmlFor = box.id;
      label.textContent = t.title;
      const del = document.createElement('button');
      del.className = 'link';
      del.title = 'Delete';
      del.textContent = '✕';
      del.onclick = () => run(() => api('DELETE', `/api/todos/${t.id}`));
      li.append(box, label, del);
      list.append(li);
    }
    const left = todos.filter(t => !t.done).length;
    document.getElementById('count').textContent = `${left} of ${todos.length} left`;
  }

  async function load() { render(await api('GET', '/api/todos')); }

  document.getElementById('add').onsubmit = e => {
    e.preventDefault();
    const input = document.getElementById('title');
    const title = input.value.trim();
    if (!title) return;
    run(async () => { await api('POST', '/api/todos', { title }); input.value = ''; });
  };
  document.getElementById('clear').onclick = () => run(() => api('DELETE', '/api/todos'));

  api('GET', '/api/info').then(i => {
    document.getElementById('info').textContent += ` App ${i.app}, release ${i.release.slice(0, 8)}.`;
  }).catch(() => {});
  load().catch(e => { errorEl.textContent = String(e.message || e); });
</script>
</body>
</html>

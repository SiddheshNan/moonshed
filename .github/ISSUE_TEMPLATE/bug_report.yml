name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an app with …
        2. Deploy …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from runtime/logs/moonshed-<date>.log or the deployment log.
      render: text
  - type: input
    id: version
    attributes:
      label: Moonshed version
      description: Output of `moonshed version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Server OS
      options: [Linux, Windows, macOS (development)]
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: App runtime
      options: [Native, Docker, Not app specific]
